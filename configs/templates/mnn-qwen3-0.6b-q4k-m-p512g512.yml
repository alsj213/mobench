# 模板 — MNN · qwen3-0.6b 长序列公平对比档（p512/g512 · t4 · r5）
# 与 llamacpp-qwen3-0.6b-p512g512.yml 严格同源同精度（q4_k_m），真机对比用。
# 用法: 替换 <占位符> 另存到 configs/local/ 后
#   cd <mobench> && python3 -m mobench run --config configs/local/<档>.yml
# 被测产物: MNN NDK 现编 build_android_llm_arm64（llm_bench + libMNN/libllm.so）
engine: mnn

platform:
  type: adb
  adb: "<ADB_EXE>"                    # 本机 adb，或 WSL 下经 interop / tools/adb-unc-wrapper.sh 调用
  device_id: "<DEVICE_ID>"            # Android 真机序列号（见 adb devices）

build:
  bin_dir: "<FORK_BIN_DIR>"           # llm_bench + 3 件 so 所在目录
  bench_bin: llm_bench
  source_dir: "<FORK_DIR>"            # 被测 MNN fork（git commit 溯源）

workload:
  threads: [4]
  rounds: 5                           # 正式统计 ≥5
  prompt_tokens: 512
  gen_tokens: 512

mnn:
  backend: cpu

models:
  - id: qwen3-0.6b-q4k-m
    path: "<MODELS_DIR>/Qwen3-0.6B-MNN-q4k-m/config.json"
    dir: "<MODELS_DIR>/Qwen3-0.6B-MNN-q4k-m"
    kind: llm
    precision: q4_k_m

methodology:
  # 绑核 + 锁频默认启用（cpu_pin: true / lock_freq: true），无需显式声明：
  #   - 绑核：按线程数选核，优先整簇（1+3+4 上 N=4 → cpu4-7）；taskset 十六进制掩码
  #   - 锁频：把所选核所属 cpufreq policy 锁到 performance，测量结束后恢复
  #   - 无 cpufreq 的环境（如 WSL2）自动降级为不绑核并打标，不中止测量
  # 关闭：cpu_pin: false / lock_freq: false；env_control: none 一次全关
  # 显式指定核集合（跳过自动探测）：pin_cpus: "4-7"
  env_control: auto

results_dir: results/mnn-p512g512         # 相对运行 cwd（<mobench>）；已在 .gitignore 忽略
