[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mobench"
version = "0.9.0"
description = "Generic inference-engine benchmarking core — traceable performance measurement & analysis for llama.cpp, MNN, and custom adapters"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "alsj213" }]
requires-python = ">=3.10"
keywords = [
  "benchmark",
  "inference",
  "llm",
  "llamacpp",
  "mnn",
  "android",
  "performance",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Benchmark",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
regression = ["scipy>=1.10"]
mcp = ["fastmcp>=3.2.4,<5"]
docs = ["markdown-it-py>=3"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]
dev = [
  "scipy>=1.10",
  "fastmcp>=3.2.4,<5",
  "markdown-it-py>=3",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
]

[project.urls]
Homepage = "https://github.com/alsj213/mobench"
Repository = "https://github.com/alsj213/mobench"
Issues = "https://github.com/alsj213/mobench/issues"
Changelog = "https://github.com/alsj213/mobench/blob/main/CHANGELOG.md"

[project.scripts]
mobench = "mobench.cli:main"

[tool.setuptools.packages.find]
include = ["mobench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
