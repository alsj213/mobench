name: 功能建议
description: 为 mobench 提出新能力或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 需求背景与痛点
      description: 希望解决什么基准测试或分析场景？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你期望的 CLI 用法、配置字段或输出格式是什么？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或补充参考
      description: 是否有其他方案或相关工具参考？
